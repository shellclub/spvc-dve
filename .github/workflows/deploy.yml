# Build → Push to GHCR → SSH pull + restart
# Secrets ที่ต้องตั้ง: DEPLOY_HOST, DEPLOY_USER, SSH_PRIVATE_KEY

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 15m
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/spvc-dve' }}"
            IMAGE="${{ env.IMAGE }}:latest"

            echo "→ Pull image from GHCR"
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            echo "→ Update source code"
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Restart services"
            COMPOSE_CMD="docker compose"
            if ! $COMPOSE_CMD version 2>/dev/null; then COMPOSE_CMD="docker-compose"; fi
            $COMPOSE_CMD up -d
            docker image prune -f

            echo "→ Waiting for app to start..."
            sleep 10
            $COMPOSE_CMD logs --tail=30 app
            echo "✅ Deploy done."
