# Build Docker image บน GitHub Actions (เน็ตเร็ว)
# แล้วส่ง image ไปเซิร์ฟเวอร์ผ่าน SSH + docker save/load
# ต้องตั้ง GitHub Secrets: DEPLOY_HOST, DEPLOY_USER, SSH_PRIVATE_KEY

name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t spvc-dve-app:latest .

      - name: Save image to tarball
        run: |
          docker save spvc-dve-app:latest | gzip > spvc-dve-app.tar.gz
          ls -lh spvc-dve-app.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: spvc-dve-app.tar.gz
          target: /tmp

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/spvc-dve' }}"

            echo "→ Load Docker image"
            docker load < /tmp/spvc-dve-app.tar.gz
            rm -f /tmp/spvc-dve-app.tar.gz

            echo "→ Update source code"
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Restart services"
            COMPOSE_CMD="docker compose"
            if ! $COMPOSE_CMD version 2>/dev/null; then COMPOSE_CMD="docker-compose"; fi
            $COMPOSE_CMD up -d
            docker image prune -f

            echo "→ Waiting for app to start..."
            sleep 10
            $COMPOSE_CMD logs --tail=30 app
            echo "✅ Deploy done."
